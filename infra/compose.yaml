# Local stack for `make dev`. OMA-13 adds Supabase and the worker.
name: oma

services:
  core:
    build:
      context: ..
      dockerfile: infra/core.Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
